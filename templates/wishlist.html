<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>My Wishlist - SHINE JEWELS</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #fffaf5;
    }

    header {
        background: #111;
        color: white;
        padding: 20px;
        text-align: center;
    }

    header h1 {
        margin: 0;
    }

    .container {
        width: 90%;
        max-width: 1000px;
        margin: 40px auto;
    }

    h2 {
        text-align: center;
        margin-bottom: 30px;
    }

    .wishlist-item {
        background: white;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .product-info h3 {
        margin: 0 0 10px;
    }

    .price {
        font-weight: bold;
        color: #b8860b;
        margin-bottom: 15px;
    }

    .cart-button {
        background: #111;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
    }

    .cart-button:hover {
        background: #b8860b;
    }

    .empty {
        text-align: center;
        padding: 50px;
        background: white;
        border-radius: 12px;
    }

    .back-button {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 20px;
        background: #111;
        color: white;
        text-decoration: none;
        border-radius: 6px;
    }
</style>
```

</head>

<body>

<header>
    <h1>💎 SHINE JEWELS</h1>
</header>

<div class="container">

```
<h2>❤️ My Wishlist</h2>

{% if items %}

    {% for item in items %}

    <div class="wishlist-item">

        <div class="product-info">

            <h3>💎 {{ item[1] }}</h3>

            <div class="price">
                ₹{{ item[2] }}
            </div>

            <form method="POST" action="{{ url_for('add_to_cart') }}">
                <input type="hidden" name="product_name" value="{{ item[1] }}">
                <input type="hidden" name="price" value="{{ item[2] }}">

                <button type="submit" class="cart-button">
                    🛒 Add to Cart
                </button>
            </form>

        </div>

    </div>

    {% endfor %}

{% else %}

    <div class="empty">

        <h3>Your wishlist is empty ❤️</h3>

        <p>Add your favourite jewellery to wishlist.</p>

        <a href="{{ url_for('home') }}" class="back-button">
            Continue Shopping
        </a>

    </div>

{% endif %}
```

</div>

</body>
</html>
